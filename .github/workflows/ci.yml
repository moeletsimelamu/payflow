name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore PayFlow.slnx
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build PayFlow.slnx -c Release --no-restore

      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/PayFlow.Migrations --startup-project src/PayFlow.Migrations

      - name: Test (unit, architecture, integration via Testcontainers) with coverage
        run: dotnet test --solution PayFlow.slnx -c Release --no-build --results-directory TestResults --coverage --coverage-output-format cobertura

      # One report across the three test projects; migrations (generated) and tests excluded.
      # Minimums sit just below the measured figures (92 % lines, 80 % branches): docs/TESTING.md.
      - name: Coverage gate (lines >= 90 %, branches >= 78 %)
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Cobertura;MarkdownSummaryGithub;HtmlSummary" \
            -assemblyfilters:"+PayFlow.*;-PayFlow.Migrations;-PayFlow.*Tests"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 build/check-coverage.py coverage-report/Cobertura.xml --line 90 --branch 78

      - name: Fail on vulnerable packages
        run: |
          dotnet list PayFlow.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            coverage-report

  frontend:
    name: Build and test (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/payflow-dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/payflow-dashboard/package-lock.json

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts --no-fund

      # Coverage thresholds (angular.json "coverageThresholds") fail this step when not met.
      - name: Unit, money-formatting and accessibility tests (Vitest + axe) with coverage gate
        run: npm run test:ci

      - name: Production build (bundle budgets enforced)
        run: npx ng build --configuration production

      - name: Fail on high-severity vulnerable packages
        run: npm audit --audit-level=high --omit=dev

  image:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: API image
        run: docker build -f src/PayFlow.Api/Dockerfile -t payflow-api:ci .
      - name: Dashboard image
        run: docker build -t payflow-web:ci web/payflow-dashboard
