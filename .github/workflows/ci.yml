name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore PayFlow.slnx
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build PayFlow.slnx -c Release --no-restore

      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/PayFlow.Migrations --startup-project src/PayFlow.Migrations

      - name: Test (unit, architecture, integration via Testcontainers)
        run: dotnet test --solution PayFlow.slnx -c Release --no-build --results-directory TestResults

      - name: Fail on vulnerable packages
        run: |
          dotnet list PayFlow.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  image:
    name: Build API image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -f src/PayFlow.Api/Dockerfile -t payflow-api:ci .
